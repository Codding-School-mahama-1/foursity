<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birth Registration - Hospital Admin</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      
      .main-content {
        margin-left: 0;
      }
      
      .flex-container {
        flex-direction: column;
      }
      
      .form-container {
        width: 100%;
        max-width: 100%;
        padding: 1rem;
      }
      
      .search-container {
        width: 100%;
        max-width: 100%;
      }
    }
    
    @media (max-width: 640px) {
      .grid-cols-2 {
        grid-template-columns: 1fr;
      }
      
      .button-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      
      .button-group button {
        width: 100%;
      }
    }
  </style>
</head>

<body class="font-serif text-gray-800 select-none">
  
  <!-- NAVBAR -->
<!-- Header -->
        <header class="bg-white shadow-md sticky top-0 z-30">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center">
                        <span class="text-2xl font-bold text-blue-600">🏥 MCH Disability Care Dashboard</span>
                    </div>
                    
                    <button id="mobile-menu-button" class="md:hidden text-gray-600 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    
                    <nav id="nav-links" class="hidden md:flex items-center space-x-6">
                        <a href="#stats" class="text-gray-700 hover:text-blue-600 transition duration-300">Statistics</a>
                        <a href="#appointments" class="text-gray-700 hover:text-blue-600 transition duration-300">Appointments</a>
                        <a href="#patients" class="text-gray-700 hover:text-blue-600 transition duration-300">Patients</a>
                        <a href="#resources" class="text-gray-700 hover:text-blue-600 transition duration-300">Resources</a>
                        <button onclick="exportToCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition duration-300">
                            <i class="fas fa-download mr-2"></i>Export Data
                        </button>
                    </nav>
                </div>
                
                <div id="mobile-menu" class="hidden md:hidden py-4 border-t border-gray-200">
                    <div class="flex flex-col space-y-4">
                        <a href="#stats" class="text-gray-700 hover:text-blue-600">Statistics</a>
                        <a href="#appointments" class="text-gray-700 hover:text-blue-600">Appointments</a>
                        <a href="#patients" class="text-gray-700 hover:text-blue-600">Patients</a>
                        <a href="#resources" class="text-gray-700 hover:text-blue-600">Resources</a>
                        <button onclick="exportToCSV()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition duration-300 text-left">
                            <i class="fas fa-download mr-2"></i>Export Data
                        </button>
                    </div>
                </div>
            </div>
        </header>
  <div class="flex min-h-screen flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="sidebar w-full md:w-64 bg-blue-500 text-white flex flex-col">
      <div class="text-2xl font-serif p-6 border-b border-blue-600 font-mono">
        Hospital Admin
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="../Dashboard.html"
          class="font-semibold text-lg md:text-xl block p-2 rounded hover:bg-purple-500 flex items-center">
          <i class="fa-solid fa-hospital text-yellow-500 text-xl md:text-2xl mr-2"></i>
          <span>Dashboard</span>
        </a>
       
        <a href="./Regester-fill-form.html"
          class="font-serif text-lg md:text-xl block p-2 rounded hover:bg-purple-500 bg-blue-600 flex items-center">
          <i class="fa-solid fa-baby text-gray-100 text-xl md:text-3xl mr-2"></i>
          <span>Birth Certification</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content flex-1 p-4 md:p-6 space-y-6 md:space-y-8 overflow-y-auto bg-white">
      <section id="register-birth" class="min-h-screen flex flex-col items-center justify-center py-4">
        <h2 class="text-2xl md:text-3xl font-serif mb-4 text-center">Register New Birth</h2>

        <!-- Search bar -->
        <div id="findBirth" class="search-container p-2 m-4 w-full md:w-96 text-center font-sans">
          <div class="flex flex-col md:flex-row">
            <input id="findId" type="text" placeholder="Find record by Register No"
              class="border border-orange-400 bg-slate-200 p-2 rounded-t-2xl md:rounded-l-2xl md:rounded-t-none flex-grow">
            <button id="findById"
              class="bg-green-400 text-white p-2 rounded-b-2xl md:rounded-r-2xl md:rounded-b-none">Search</button>
          </div>
        </div>

        <!-- Form -->
        <form id="birthForm"
          class="form-container bg-slate-400 shadow rounded-2xl p-4 md:p-6 space-y-4 w-full max-w-[790px]">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Baby Name</label>
              <input id="BabyName" type="text"
                class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                placeholder="Baby Name" required>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Date of Birth</label>
              <input id="Dob" type="date"
                class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                required>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Gender</label>
              <select id="Gender"
                class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Mother's Name</label>
              <input id="MotherName" type="text"
                class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                placeholder="Mother Name">
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Register No</label>
              <input id="RegisterNo" type="number"
                class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                placeholder="Registration number" required>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Notes</label>
              <textarea id="Notes"
                class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                rows="2" placeholder="Any notes"></textarea>
            </div>
          </div>

          <!-- Buttons -->
          <div class="button-group space-y-2 md:space-y-0 md:space-x-2 mt-4">
            <button id="insertBtn" type="button"
              class="bg-green-600 text-white px-6 py-2 rounded-xl hover:bg-green-700 w-full md:w-auto">INSERT</button>
            <button id="updateBtn" type="button"
              class="bg-blue-600 text-white px-6 py-2 rounded-xl hover:bg-blue-700 w-full md:w-auto">UPDATE</button>
            <button id="removeBtn" type="button"
              class="bg-red-600 text-white px-6 py-2 rounded-xl hover:bg-red-700 w-full md:w-auto">REMOVE</button>
          </div>
        </form>

        <!-- Search Results -->
        <div id="searchResult"
          class="form-container bg-gray-200 shadow rounded-2xl p-4 md:p-6 mt-6 w-full max-w-[790px] hidden">
          <h3 class="text-xl text-center font-bold mb-4 text-blue-700">Birth Record</h3>
          <div class="text-center grid grid-cols-1 sm:grid-cols-2 gap-2 m-4">
            <p id="showName"></p>
            <p id="showDOB"></p>
            <p id="showGender"></p>
            <p id="showMother"></p>
            <p id="showNotes"></p>
            <p id="showRegNo"></p>
          </div>
          <div class="mt-4 text-center">
            <button id="backBtn"
              class="bg-blue-500 text-white px-6 py-2 rounded-xl hover:bg-blue-700 w-full md:w-auto">Back
              to Form</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Menu Functionality Script -->


  <!-- Firebase Script -->
  <script type="module" src="../JavaScript-Files/Dashboard.js">
  </script>
</body>
</html>
